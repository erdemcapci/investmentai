name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q investment_ai main.py
      - name: Ruff
        run: ruff check investment_ai main.py tests
      - name: Whitespace
        run: git diff-tree --check --no-commit-id -r HEAD
