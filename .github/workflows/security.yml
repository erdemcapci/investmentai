name: scheduled dependency audit
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock
